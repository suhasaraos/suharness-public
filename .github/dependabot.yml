version: 2
updates:
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # These ship together and drift apart badly if bumped one at a time.
      microsoft-extensions-ai:
        patterns:
          - "Microsoft.Extensions.AI*"
          - "Microsoft.Agents.AI*"
      test-tooling:
        patterns:
          - "xunit*"
          - "Microsoft.NET.Test.Sdk"
          - "coverlet.*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
